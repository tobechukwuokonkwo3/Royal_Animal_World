{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1>Change Password</h1>

<form method="POST" class="card" style="max-width: 400px;">
    <label>Current Password</label>
    <input type="password" name="current_password" required>

    <label>New Password</label>
    <input type="password" name="new_password" required>

    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required>

    <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Change Password</button>
    <a href="{{ url_for('staff_dashboard') }}" class="btn" style="margin-left: 0.5rem;">Cancel</a>
</form>
{% endblock %}
