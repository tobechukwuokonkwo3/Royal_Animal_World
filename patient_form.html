
{% extends "base.html" %}
{% block title %}{{ 'Edit' if patient else 'New' }} Patient{% endblock %}
{% block content %}
<h1>{{ 'Edit Patient' if patient else 'New Patient Record' }}</h1>

<form method="POST" enctype="multipart/form-data" class="card">
    <div class="grid-2">
        <div>
            <label>Pet Name *</label>
            <input type="text" name="pet_name" value="{{ patient.pet_name if patient else '' }}" required>
        </div>
        <div>
            <label>Species *</label>
            <select name="species" id="species" required onchange="updateBreeds()">
                <option value="">-- Select Species --</option>
                <option value="Canine" {% if patient and patient.breed and 'Canine' in patient.breed %}selected{% endif %}>Canine (Dog)</option>
                <option value="Feline" {% if patient and patient.breed and 'Feline' in patient.breed %}selected{% endif %}>Feline (Cat)</option>
                <option value="Poultry">Poultry</option>
                <option value="Avian">Avian (Bird)</option>
                <option value="Rabbit">Rabbit</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label>Breed *</label>
            <select name="breed" id="breed" required>
                <option value="">-- Select Breed --</option>
            </select>
        </div>
        <div>
            <label>Owner Name *</label>
            <input type="text" name="owner_name" value="{{ patient.owner_name if patient else '' }}" required>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label>Owner Phone</label>
            <input type="text" name="owner_phone" value="{{ patient.owner_phone if patient else '' }}">
        </div>
        <div>
            <label>Age</label>
            <input type="text" name="age" value="{{ patient.age if patient else '' }}" placeholder="e.g. 4 years">
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label>Weight (kg)</label>
            <input type="number" step="0.1" name="weight" value="{{ patient.weight if patient else '' }}">
        </div>
        <div>
            <label>Vaccination Status</label>
            <select name="vacc_status">
                <option value="Yes" {% if patient and patient.vacc_status == 'Yes' %}selected{% endif %}>Yes</option>
                <option value="No" {% if patient and patient.vacc_status == 'No' %}selected{% endif %}>No</option>
                <option value="Partial" {% if patient and patient.vacc_status == 'Partial' %}selected{% endif %}>Partial</option>
                <option value="Unknown" {% if not patient or patient.vacc_status == 'Unknown' %}selected{% endif %}>Unknown</option>
            </select>
        </div>
    </div>

    <label>Chief Complaint</label>
    <input type="text" name="complaint" value="{{ patient.complaint if patient else '' }}">

    <label>Clinical Notes</label>
    <textarea name="clinical_notes" rows="5">{{ patient.clinical_notes if patient else '' }}</textarea>

    <label>Next Appointment</label>
    <input type="date" name="next_appt" value="{{ patient.next_appt if patient else '' }}">

    <label>Upload Medical Files (PDF, Images, X-Rays)</label>
    <input type="file" name="medical_files" multiple accept=".pdf,.jpg,.jpeg,.png">

    <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Save Record</button>
    <a href="{{ url_for('staff_patients') }}" class="btn" style="margin-left: 0.5rem;">Cancel</a>
</form>

<script>
const breeds = {
    "Canine": ["Pitbull", "Bulldog", "German Shepherd", "Rottweiler", "Labrador", "Local Breed", "Mixed Breed", "Other"],
    "Feline": ["Persian", "Siamese", "Local Cat", "Mixed Breed", "Other"],
    "Poultry": ["Broiler", "Layer", "Local Chicken", "Turkey", "Duck", "Other"],
    "Avian": ["Parrot", "Lovebird", "Canary", "Other"],
    "Rabbit": ["Local Rabbit", "Other"],
    "Other": ["Other"]
};

function updateBreeds() {
    const species = document.getElementById("species").value;
    const breedSelect = document.getElementById("breed");
    breedSelect.innerHTML = '<option value="">-- Select Breed --</option>';

    if (breeds[species]) {
        breeds[species].forEach(function(breed) {
            const option = document.createElement("option");
            option.value = species + " - " + breed;
            option.text = breed;
            breedSelect.appendChild(option);
        });
    }
}

// Run once on page load
updateBreeds();
</script>
{% endblock %}
