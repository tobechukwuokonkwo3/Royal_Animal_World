{% extends "base.html" %}
{% block title %}Staff Login | Royal Animal World{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 style="text-align:center; color: var(--primary-light);">Staff Login</h2>
        <p style="text-align:center; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Authorized personnel only</p>
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required placeholder="e.g. dr.adeola">
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 0.5rem;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
